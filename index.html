<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#49352d">
  <meta name="description" content="Небольшой подарок. Только для тебя.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23962d3e'/%3E%3Ctext x='32' y='46' font-size='42' text-anchor='middle' fill='%23f5ebdd'%3E%E2%99%A1%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="./gate.css">
  <title>Только для тебя</title>
</head>
<body>
  <main id="gate">
    <span class="heart" aria-hidden="true">♡</span>
    <p class="eyebrow">Маленький мир для двоих</p>
    <h1>Только для тебя</h1>
    <p class="intro">У нашей истории есть свой ключ.</p>
    <form id="unlock-form">
      <label for="password">Наш пароль</label>
      <div class="input-row"><input id="password" name="password" type="password" autocomplete="current-password" required spellcheck="false" autocapitalize="off"><button id="reveal" type="button" aria-label="Показать пароль" aria-pressed="false">Показать</button></div>
      <button id="unlock" type="submit">Открыть открытку <span aria-hidden="true">↗</span></button>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
    <p class="note">Письмо и фотографии откроются после ввода пароля.</p>
  </main>
  <button id="lock" type="button" hidden aria-label="Закрыть открытку и вернуться к паролю">Закрыть ♡</button>
  <noscript>Для открытия зашифрованной открытки нужен JavaScript.</noscript>
  <script src="./gate.js" defer></script>
</body>
</html>
